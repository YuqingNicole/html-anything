<body class="artifact-page">
  <div class="grain"></div>
  <header class="artifact-nav"><a class="brand" href="index.html"><span class="brand-mark">✳</span> HTML<span class="muted"> Anything</span></a><div class="artifact-breadcrumb mono"><span>ARTIFACT</span><span class="breadcrumb-slash">/</span><span id="artifactName">UNTITLED EXPLAINER</span></div><div class="artifact-nav-actions"><span id="artifactStatus" class="mono">LOCAL ARTIFACT</span><a class="back-link" href="index.html">← make another</a></div></header>
